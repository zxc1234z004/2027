<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>千人即時點名與單位區域戰情系統 (支援區域數字排序)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // ==========================================
    // 1. 系統設定區 (請填入你的 Firebase 網址與管理員密碼)
    // ==========================================
    const CONFIG = {
      // 請貼上你的 Firebase Realtime Database 網址（結尾不要有斜線 /）
      FIREBASE_DB_URL: "https://ikt-1000-default-rtdb.asia-southeast1.firebasedatabase.app",
      EVENT_ID: "CHECKIN_2026_MAIN",
      ADMIN_PIN: "8888", // 管理員與幹部操作密碼
    };

    // 智慧型自然數字排序器（自動將 001區, 015區, 030區 由小到大排列）
    const naturalCollator = new Intl.Collator("zh-Hant", { numeric: true, sensitivity: "base" });
    const sortByNumberAsc = (aStr = "", bStr = "") => {
      const sA = String(aStr).trim();
      const sB = String(bStr).trim();
      const numA = sA.match(/\d+/);
      const numB = sB.match(/\d+/);
      // 若兩者皆包含數字（例如 "015區" 與 "001區"），直接比對數值大小 (1 < 15 < 30)
      if (numA && numB && Number(numA[0]) !== Number(numB[0])) {
        return Number(numA[0]) - Number(numB[0]);
      }
      return naturalCollator.compare(sA, sB);
    };

    // 預設測試名單（故意將區域順序打亂為 030區, 015區, 001區，驗證系統自動由小到大排序）
    const generateDefaultRoster = () => {
      const unitRegions = {
        "正和單位": ["030區", "015區", "001區", "002區"],
        "崇正單位": ["025區", "005區", "012區", "003區"],
        "明善單位": ["040區", "008區", "020區", "010區"],
        "慈光單位": ["050區", "018區", "006區", "033區"]
      };
      const units = Object.keys(unitRegions);
      const genders = ["乾", "坤"];
      const roster = [];

      for (let i = 1; i <= 1000; i++) {
        const unit = units[i % units.length];
        const regions = unitRegions[unit];
        const region = regions[i % regions.length];
        const gender = genders[i % 2];
        roster.push({
          memberId: `M${String(i).padStart(4, "0")}`,
          gender,
          code: `${String(i).padStart(4, "0")}`,
          name: `道親_${i}`,
          unit,
          region
        });
      }
      return roster;
    };

    // 性別標準化判斷
    const isMaleGender = (g) => ["乾", "乾道", "男", "M", "male", "童"].includes(String(g).trim());
    const isFemaleGender = (g) => ["坤", "坤道", "女", "F", "female"].includes(String(g).trim());

    function App() {
      const urlParams = new URLSearchParams(window.location.search);
      const isCheckinOnly = urlParams.get("mode") === "checkin";

      const [view, setView] = useState(isCheckinOnly ? "checkin" : "dashboard");

      // 管理員權限狀態
      const [isAdminUnlocked, setIsAdminUnlocked] = useState(() => {
        return sessionStorage.getItem("ADMIN_UNLOCKED") === "true";
      });
      const [pinModalOpen, setPinModalOpen] = useState(false);
      const [pinInput, setPinInput] = useState("");
      const pendingActionRef = useRef(null);

      // 應到名單母體與雲端載入狀態
      const [roster, setRoster] = useState(() => {
        const saved = localStorage.getItem(`ROSTER_${CONFIG.EVENT_ID}`);
        return saved ? JSON.parse(saved) : generateDefaultRoster();
      });
      const [rosterSyncStatus, setRosterSyncStatus] = useState("載入中...");

      // 已簽到紀錄
      const [checkins, setCheckins] = useState(() => {
        const saved = localStorage.getItem(`CHECKINS_${CONFIG.EVENT_ID}`);
        return saved ? JSON.parse(saved) : {};
      });

      // 點名端狀態
      const [queryInput, setQueryInput] = useState("");
      const [matchedCandidates, setMatchedCandidates] = useState([]);
      const [selectedMember, setSelectedMember] = useState(null);
      const [checkinState, setCheckinState] = useState("idle");
      const [receipt, setReceipt] = useState(null);

      // 戰情室篩選狀態
      const [selectedUnit, setSelectedUnit] = useState("ALL");
      const [selectedRegion, setSelectedRegion] = useState("ALL");
      const [genderFilter, setGenderFilter] = useState("ALL");
      const [statusFilter, setStatusFilter] = useState("ALL");
      const [searchKeyword, setSearchKeyword] = useState("");
      const [isSimulating, setIsSimulating] = useState(false);
      const [isUploadingRoster, setIsUploadingRoster] = useState(false);

      const fileInputRef = useRef(null);

      // ==========================================
      // 2. 管理員密碼保護攔截器
      // ==========================================
      const requireAdmin = (actionCallback) => {
        if (isAdminUnlocked) {
          actionCallback();
        } else {
          pendingActionRef.current = actionCallback;
          setPinInput("");
          setPinModalOpen(true);
        }
      };

      const handleVerifyPin = (e) => {
        e.preventDefault();
        if (pinInput.trim() === CONFIG.ADMIN_PIN) {
          setIsAdminUnlocked(true);
          sessionStorage.setItem("ADMIN_UNLOCKED", "true");
          setPinModalOpen(false);
          if (pendingActionRef.current) {
            const act = pendingActionRef.current;
            pendingActionRef.current = null;
            act();
          }
        } else {
          alert("❌ 管理員密碼錯誤！");
          setPinInput("");
        }
      };

      const handleLockAdmin = () => {
        setIsAdminUnlocked(false);
        sessionStorage.removeItem("ADMIN_UNLOCKED");
      };

      // ==========================================
      // 3. 雲端母體名單拉取 + 簽到狀態 SSE 即時推播
      // ==========================================
      useEffect(() => {
        if (!CONFIG.FIREBASE_DB_URL) {
          setRosterSyncStatus("本機模擬名單");
          return;
        }

        const rosterUrl = `${CONFIG.FIREBASE_DB_URL}/rosters/${CONFIG.EVENT_ID}.json`;
        fetch(rosterUrl)
          .then(r => r.json())
          .then(cloudRoster => {
            if (Array.isArray(cloudRoster) && cloudRoster.length > 0) {
              setRoster(cloudRoster);
              localStorage.setItem(`ROSTER_${CONFIG.EVENT_ID}`, JSON.stringify(cloudRoster));
              setRosterSyncStatus(`已同步雲端名單 (${cloudRoster.length}人)`);
            } else {
              setRosterSyncStatus("尚未上傳雲端名單 (目前顯示預設名單)");
            }
          })
          .catch(err => {
            console.error("雲端名單讀取失敗，改用本地快取:", err);
            setRosterSyncStatus("使用手機快取名單");
          });

        const checkinsUrl = `${CONFIG.FIREBASE_DB_URL}/checkins/${CONFIG.EVENT_ID}.json`;
        const es = new EventSource(checkinsUrl);

        fetch(checkinsUrl)
          .then(r => r.json())
          .then(data => { setCheckins(data || {}); })
          .catch(err => console.error("簽到初始載入失敗:", err));

        es.addEventListener("put", (e) => {
          const payload = JSON.parse(e.data);
          if (payload.path === "/") {
            setCheckins(payload.data || {});
          } else {
            const memberId = payload.path.replace("/", "");
            if (payload.data === null) {
              setCheckins(prev => {
                const next = { ...prev };
                delete next[memberId];
                return next;
              });
            } else {
              setCheckins(prev => ({ ...prev, [memberId]: payload.data }));
            }
          }
        });

        return () => es.close();
      }, []);

      useEffect(() => {
        localStorage.setItem(`CHECKINS_${CONFIG.EVENT_ID}`, JSON.stringify(checkins));
      }, [checkins]);

      // ==========================================
      // 4. 高併發不掉單寫入核心
      // ==========================================
      const submitCheckin = async (memberId, status = "present", method = "self") => {
        const record = { status, time: Date.now(), method };

        localStorage.setItem(`MY_RECEIPT_${memberId}`, JSON.stringify(record));

        if (!CONFIG.FIREBASE_DB_URL) {
          setCheckins(prev => ({ ...prev, [memberId]: record }));
          return record;
        }

        const endpoint = `${CONFIG.FIREBASE_DB_URL}/checkins/${CONFIG.EVENT_ID}/${encodeURIComponent(memberId)}.json`;
        let delay = 800;
        for (let attempt = 1; attempt <= 5; attempt++) {
          try {
            const res = await fetch(endpoint, {
              method: "PUT",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(record)
            });
            if (res.ok) return record;
          } catch (err) {
            console.warn(`重試第 ${attempt} 次...`);
          }
          if (method === "self") setCheckinState("retrying");
          await new Promise(r => setTimeout(r, delay + Math.random() * 400));
          delay *= 2;
        }
        throw new Error("網路忙碌，已保存本地簽到憑證");
      };

      // ==========================================
      // 5. 匯入 CSV 並自動同步至 Firebase 雲端母體名單
      // ==========================================
      const handleImportCSV = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = async (evt) => {
          const lines = evt.target.result.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
          if (lines.length < 2) {
            alert("CSV 檔案內容過少或格式不正確！");
            return;
          }

          const startIdx = /memberId|求道名|單位|區域/i.test(lines[0]) ? 1 : 0;
          const imported = lines.slice(startIdx).map((line, idx) => {
            const cols = line.split(",").map(c => c.trim());
            return {
              memberId: cols[0] || `M${String(idx + 1).padStart(4, "0")}`,
              gender: cols[1] || "乾",
              code: cols[2] || `C${String(idx + 1).padStart(3, "0")}`,
              name: cols[3] || `未命名_${idx + 1}`,
              unit: cols[4] || "未分單位",
              region: cols[5] || "未分區域"
            };
          });

          if (imported.length === 0) return;

          // 匯入時即預先按「區域數字由小到大 -> 編號由小到大」排好
          imported.sort((a, b) => {
            const rDiff = sortByNumberAsc(a.region, b.region);
            if (rDiff !== 0) return rDiff;
            const uDiff = sortByNumberAsc(a.unit, b.unit);
            if (uDiff !== 0) return uDiff;
            return sortByNumberAsc(a.code, b.code);
          });

          setRoster(imported);
          localStorage.setItem(`ROSTER_${CONFIG.EVENT_ID}`, JSON.stringify(imported));
          setSelectedUnit("ALL");
          setSelectedRegion("ALL");

          if (CONFIG.FIREBASE_DB_URL) {
            setIsUploadingRoster(true);
            setRosterSyncStatus("正在上傳名單至雲端...");
            try {
              const res = await fetch(`${CONFIG.FIREBASE_DB_URL}/rosters/${CONFIG.EVENT_ID}.json`, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(imported)
              });
              if (res.ok) {
                setRosterSyncStatus(`已同步雲端名單 (${imported.length}人)`);
                alert(`✅ 成功匯入 ${imported.length} 筆名單（已自動依區域數字由小到大排序），並已同步至 Firebase 雲端！`);
              } else {
                throw new Error("HTTP " + res.status);
              }
            } catch (err) {
              console.error("雲端名單上傳失敗:", err);
              setRosterSyncStatus("雲端上傳失敗 (僅儲存於本機)");
              alert(`⚠️ 名單已載入本機，但上傳至 Firebase 失敗，請確認 Firebase Rules 是否已開放 /rosters 寫入權限！`);
            } finally {
              setIsUploadingRoster(false);
            }
          } else {
            alert(`✅ 成功於本機模擬模式匯入 ${imported.length} 筆名單（已自動依區域數字由小到大排序）！`);
          }
        };
        reader.readAsText(file, "UTF-8");
        e.target.value = "";
      };

      // ==========================================
      // 6. 清空雲端與本機所有簽到紀錄
      // ==========================================
      const handleClearAllCheckins = () => {
        requireAdmin(async () => {
          if (!confirm("⚠️ 確定要【清空全場所有已簽到紀錄】嗎？此動作會同步清除雲端資料且無法復原！")) return;

          setCheckins({});
          localStorage.removeItem(`CHECKINS_${CONFIG.EVENT_ID}`);

          if (CONFIG.FIREBASE_DB_URL) {
            try {
              const res = await fetch(`${CONFIG.FIREBASE_DB_URL}/checkins/${CONFIG.EVENT_ID}.json`, {
                method: "DELETE"
              });
              if (res.ok) {
                alert("✅ 已成功清空雲端與本機的所有簽到紀錄！");
              } else {
                alert("⚠️ 雲端清空失敗，請檢查 Firebase Rules 權限。");
              }
            } catch (err) {
              alert("⚠️ 網路連線異常，雲端清空失敗。");
            }
          }
        });
      };

      // 參加者輸入搜尋
      const handleSearchMember = (val) => {
        setQueryInput(val);
        setSelectedMember(null);
        const q = val.trim().toLowerCase();
        if (!q) {
          setMatchedCandidates([]);
          return;
        }
        const matches = roster
          .filter(m =>
            m.memberId.toLowerCase().includes(q) ||
            m.code.toLowerCase().includes(q) ||
            m.name.toLowerCase().includes(q)
          )
          .sort((a, b) => sortByNumberAsc(a.region, b.region))
          .slice(0, 8);

        setMatchedCandidates(matches);
        if (matches.length === 1 && (
          matches[0].memberId.toLowerCase() === q ||
          matches[0].code.toLowerCase() === q ||
          matches[0].name.toLowerCase() === q
        )) {
          setSelectedMember(matches[0]);
        }
      };

      // 參加者確認送出點名
      const handleConfirmCheckin = async (e) => {
        e.preventDefault();
        const target = selectedMember || matchedCandidates[0];
        if (!target) {
          alert("請先輸入編號、求道名或 memberId 並點選名單！");
          return;
        }
        setCheckinState("sending");
        try {
          const rec = await submitCheckin(target.memberId, "present", "self");
          setReceipt({ ...target, ...rec });
          setCheckinState("success");
        } catch (err) {
          setReceipt({ ...target, time: Date.now(), status: "offline_saved" });
          setCheckinState("success");
        }
      };

      // 模擬千人瞬間點名壓力測試
      const runConcurrencyTest = () => {
        requireAdmin(() => {
          if (isSimulating) return;
          setIsSimulating(true);
          let rounds = 0;
          const timer = setInterval(() => {
            rounds++;
            setCheckins(prev => {
              const next = { ...prev };
              for (let i = 0; i < 75; i++) {
                const p = roster[Math.floor(Math.random() * roster.length)];
                if (p && !next[p.memberId]) {
                  next[p.memberId] = {
                    status: Math.random() > 0.95 ? "leave" : "present",
                    time: Date.now(),
                    method: "sim"
                  };
                }
              }
              return next;
            });
            if (rounds >= 14) {
              clearInterval(timer);
              setIsSimulating(false);
            }
          }, 80);
        });
      };

      // ==========================================
      // 7. 即時三維度統計聚合 (支援單位與區域數字由小到大排序)
      // ==========================================
      const stats = useMemo(() => {
        const unitMap = {};
        const regionMap = {};
        let totalPresent = 0, totalLeave = 0;
        let maleTotal = 0, malePresent = 0;
        let femaleTotal = 0, femalePresent = 0;

        roster.forEach(p => {
          const c = checkins[p.memberId];
          const isPresent = c?.status === "present";
          const isLeave = c?.status === "leave";
          const isM = isMaleGender(p.gender);
          const isF = isFemaleGender(p.gender);

          if (isPresent) totalPresent++;
          if (isLeave) totalLeave++;
          if (isM) { maleTotal++; if (isPresent) malePresent++; }
          if (isF) { femaleTotal++; if (isPresent) femalePresent++; }

          // 1. 第一層：單位統計
          if (!unitMap[p.unit]) {
            unitMap[p.unit] = {
              name: p.unit,
              total: 0, present: 0, leave: 0,
              maleTotal: 0, malePresent: 0,
              femaleTotal: 0, femalePresent: 0
            };
          }
          const u = unitMap[p.unit];
          u.total++;
          if (isPresent) u.present++;
          if (isLeave) u.leave++;
          if (isM) { u.maleTotal++; if (isPresent) u.malePresent++; }
          if (isF) { u.femaleTotal++; if (isPresent) u.femalePresent++; }

          // 2. 第二層：區域統計 (隨第一層所選「單位」動態連動)
          if (selectedUnit === "ALL" || p.unit === selectedUnit) {
            const regionKey = `${p.unit}_${p.region}`;
            if (!regionMap[regionKey]) {
              regionMap[regionKey] = {
                key: regionKey,
                name: p.region,
                unit: p.unit,
                total: 0, present: 0, leave: 0,
                maleTotal: 0, malePresent: 0,
                femaleTotal: 0, femalePresent: 0
              };
            }
            const r = regionMap[regionKey];
            r.total++;
            if (isPresent) r.present++;
            if (isLeave) r.leave++;
            if (isM) { r.maleTotal++; if (isPresent) r.malePresent++; }
            if (isF) { r.femaleTotal++; if (isPresent) r.femalePresent++; }
          }
        });

        // 單位卡片排序
        const sortedUnits = Object.values(unitMap).sort((a, b) => sortByNumberAsc(a.name, b.name));

        // 區域卡片排序：優先按「區域數字由小到大 (001區 -> 015區 -> 030區)」排序
        const sortedRegions = Object.values(regionMap).sort((a, b) => {
          const regionCompare = sortByNumberAsc(a.name, b.name);
          if (regionCompare !== 0) return regionCompare;
          return sortByNumberAsc(a.unit, b.unit);
        });

        return {
          total: roster.length,
          present: totalPresent,
          leave: totalLeave,
          absent: roster.length - totalPresent - totalLeave,
          rate: roster.length ? ((totalPresent / roster.length) * 100).toFixed(1) : "0.0",
          maleTotal, malePresent,
          femaleTotal, femalePresent,
          units: sortedUnits,
          regions: sortedRegions
        };
      }, [roster, checkins, selectedUnit]);

      // 戰情室人員明細過濾 + 依「區域數字由小到大 -> 編號由小到大」自動排序
      const filteredList = useMemo(() => {
        const list = roster.filter(p => {
          if (selectedUnit !== "ALL" && p.unit !== selectedUnit) return false;
          if (selectedRegion !== "ALL" && p.region !== selectedRegion) return false;
          if (genderFilter === "MALE" && !isMaleGender(p.gender)) return false;
          if (genderFilter === "FEMALE" && !isFemaleGender(p.gender)) return false;

          const st = checkins[p.memberId]?.status || "absent";
          if (statusFilter === "PRESENT" && st !== "present") return false;
          if (statusFilter === "ABSENT" && st !== "absent") return false;
          if (statusFilter === "LEAVE" && st !== "leave") return false;

          if (searchKeyword) {
            const q = searchKeyword.trim().toLowerCase();
            return (
              p.memberId.toLowerCase().includes(q) ||
              p.code.toLowerCase().includes(q) ||
              p.name.toLowerCase().includes(q) ||
              p.unit.toLowerCase().includes(q) ||
              p.region.toLowerCase().includes(q)
            );
          }
          return true;
        });

        return list.sort((a, b) => {
          const rDiff = sortByNumberAsc(a.region, b.region);
          if (rDiff !== 0) return rDiff;
          const uDiff = sortByNumberAsc(a.unit, b.unit);
          if (uDiff !== 0) return uDiff;
          return sortByNumberAsc(a.code, b.code);
        });
      }, [roster, checkins, selectedUnit, selectedRegion, genderFilter, statusFilter, searchKeyword]);

      // 下載 CSV 範本或匯出即時點名結果（匯出時亦按區域數字由小到大排序）
      const exportCSV = (isTemplate = false) => {
        if (isTemplate) {
          const sample = "\uFEFFmemberId,性別,編號,求道名,單位,區域\nM0001,乾,A001,王大明,正和單位,015區\nM0002,坤,A002,林淑芬,正和單位,030區\nM0003,乾,B001,陳建宏,正和單位,001區";
          const blob = new Blob([sample], { type: "text/csv;charset=utf-8;" });
          const a = document.createElement("a");
          a.href = URL.createObjectURL(blob);
          a.download = "點名匯入範本_6欄.csv";
          a.click();
          return;
        }

        const headers = ["memberId", "性別", "編號", "求道名", "單位", "區域", "出席狀態", "簽到時間", "簽到方式"];
        const sortedRoster = [...roster].sort((a, b) => {
          const rDiff = sortByNumberAsc(a.region, b.region);
          if (rDiff !== 0) return rDiff;
          const uDiff = sortByNumberAsc(a.unit, b.unit);
          if (uDiff !== 0) return uDiff;
          return sortByNumberAsc(a.code, b.code);
        });

        const rows = sortedRoster.map(p => {
          const c = checkins[p.memberId];
          const stText = c?.status === "present" ? "已出席" : c?.status === "leave" ? "請假" : "未到";
          const tText = c?.time ? new Date(c.time).toLocaleTimeString("zh-TW", { hour12: false }) : "-";
          const mText = c?.method === "admin" ? "幹部代簽" : c?.method === "self" ? "本人手機" : c?.method || "-";
          return [p.memberId, p.gender, p.code, p.name, p.unit, p.region, stText, tText, mText].join(",");
        });
        const csv = "\uFEFF" + [headers.join(","), ...rows].join("\n");
        const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = `單位區域出席總表_${new Date().toISOString().slice(0, 10)}.csv`;
        a.click();
      };

      return (
        <div className="min-h-screen flex flex-col">
          <input
            ref={fileInputRef}
            type="file"
            accept=".csv"
            onChange={handleImportCSV}
            className="hidden"
          />

                    <div>
                      <label className="block text-xs text-slate-300 mb-1.5">
                        搜尋編號或求道名 (目前名單共 {roster.length} 人)
                      </label>
                      <input
                        type="text"
                        required
                        value={queryInput}
                        onChange={e => handleSearchMember(e.target.value)}
                        placeholder="請輸入編號或求道名..."
                        className="w-full px-4 py-3 rounded-xl bg-slate-900 border border-slate-700 text-white text-base focus:outline-none focus:border-emerald-500"
                      />
                    </div>

                    {matchedCandidates.length > 0 && (
                      <div className="space-y-1.5 max-h-56 overflow-y-auto bg-slate-900/90 p-2 rounded-xl border border-slate-700">
                        <div className="text-[11px] text-slate-400 px-1">請點選確認您的身份：</div>
                        {matchedCandidates.map(item => {
                          const isSelected = selectedMember?.memberId === item.memberId;
                          return (
                            <div
                              key={item.memberId}
                              onClick={() => setSelectedMember(item)}
                              className={`p-2.5 rounded-lg border flex items-center justify-between cursor-pointer transition ${
                                isSelected
                                  ? "bg-emerald-950/80 border-emerald-400 text-white"
                                  : "bg-slate-800/80 border-slate-700/80 text-slate-200 hover:border-slate-500"
                              }`}
                            >
                              <div>
                                <div className="font-bold text-sm flex items-center gap-2">
                                  <span>{item.name}</span>
                                  <span className="text-xs px-1.5 py-0.5 rounded bg-slate-700 text-amber-300 font-mono">
                                    編號 {item.code}
                                  </span>
                                </div>
                                <div className="text-xs text-slate-400 mt-0.5">
                                  <b className="text-emerald-300">{item.unit}</b> / <b className="text-sky-300">{item.region}</b> ｜ {item.gender} ｜ {item.memberId}
                                </div>
                              </div>
                              <span className={`text-xs font-bold px-2 py-1 rounded ${
                                isSelected ? "bg-emerald-500 text-slate-950" : "bg-slate-700 text-slate-300"
                              }`}>
                                {isSelected ? "已選取 ✓" : "點選"}
                              </span>
                            </div>
                          );
                        })}
                      </div>
                    )}

                    <button
                      type="submit"
                      disabled={checkinState === "sending" || checkinState === "retrying"}
                      className="w-full py-3.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-base shadow-lg shadow-emerald-600/30 transition disabled:opacity-50"
                    >
                      {checkinState === "idle" && (selectedMember ? `確認簽到：${selectedMember.name} (${selectedMember.unit}-${selectedMember.region})` : "立即簽到")}
                      {checkinState === "sending" && "資料傳送中..."}
                      {checkinState === "retrying" && "網路忙碌，自動重試保護中..."}
                    </button>
                  </form>
                ) : (
                  <div className="text-center space-y-4">
                    <div className="w-16 h-16 rounded-full bg-emerald-500/20 border-2 border-emerald-400 text-emerald-400 flex items-center justify-center mx-auto text-3xl font-bold">
                      ✓
                    </div>
                    <h2 className="text-2xl font-extrabold text-white">點名完成！</h2>
                    <p className="text-xs text-slate-400">請出示此畫面供現場服務人員確認</p>

                    <div className="bg-slate-900 border border-slate-700 rounded-xl p-4 text-left space-y-2.5">
                      <div className="flex justify-between border-b border-slate-800 pb-2">
                        <span className="text-xs text-slate-400">所屬單位</span>
                        <span className="text-lg font-extrabold text-emerald-400">{receipt?.unit}</span>
                      </div>
                      <div className="flex justify-between border-b border-slate-800 pb-2">
                        <span className="text-xs text-slate-400">所屬區域</span>
                        <span className="text-base font-extrabold text-indigo-400">{receipt?.region}</span>
                      </div>
                      <div className="flex justify-between border-b border-slate-800 pb-2">
                        <span className="text-xs text-slate-400">求道名</span>
                        <span className="text-base font-bold text-white">{receipt?.name}</span>
                      </div>
                      <div className="flex justify-between border-b border-slate-800 pb-2">
                        <span className="text-xs text-slate-400">編號 / 性別</span>
                        <span className="text-sm font-semibold text-amber-300">
                          {receipt?.code} （{receipt?.gender}）
                        </span>
                      </div>
                      <div className="flex justify-between border-b border-slate-800 pb-2">
                        <span className="text-xs text-slate-400">memberId</span>
                        <span className="text-xs font-mono text-slate-300">{receipt?.memberId}</span>
                      </div>
                      <div className="flex justify-between">
                        <span className="text-xs text-slate-400">簽到時間</span>
                        <span className="text-xs font-mono text-emerald-400">
                          {new Date(receipt?.time).toLocaleTimeString("zh-TW", { hour12: false })}
                        </span>
                      </div>
                    </div>

                    <button
                      onClick={() => {
                        setCheckinState("idle");
                        setQueryInput("");
                        setSelectedMember(null);
                        setMatchedCandidates([]);
                      }}
                      className="w-full py-2.5 rounded-xl bg-slate-700 hover:bg-slate-600 text-xs text-slate-200 transition"
                    >
                      幫同行人員代簽 / 返回
                    </button>
                  </div>
                )}
              </div>
            </main>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
