<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>千人即時點名與單位區域戰情系統 (5欄免ID版)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans pb-24">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // ==========================================
    // 1. 系統設定區 (已綁定你的 ikt-1000 Firebase 資料庫)
    // ==========================================
    const CONFIG = {
      FIREBASE_DB_URL: "https://ikt-1000-default-rtdb.asia-southeast1.firebasedatabase.app",
      EVENT_ID: "CHECKIN_2026_MAIN",
      ADMIN_PIN: "8888", // 修改既有紀錄、匯入名單、清空紀錄之管理員密碼
      GAS_SYNC_URL: "https://script.google.com/macros/s/AKfycbzCXzWVrY7ztsmyf-NBOZ_fzDv45ijg63I6IP8VuEwVgxWSxaDahZ7xMWmmax8xEmOKFg/exec",  // 選填：GAS 網頁應用程式網址
    };

    const LEAVE_REASONS = ["事假", "病假", "公假", "晚到", "自行填寫"];

    // 自動組合唯一鍵（與 GAS 的 makeRecordKey 完全一致：性別_編號）
    const makeRecordKey = (gender, code, name, fallbackIdx) => {
      const g = String(gender || "").trim();
      const c = String(code || "").trim();
      const n = String(name || "").trim();
      if (c) return `${g}_${c}`;
      return `${g}_${n}_${fallbackIdx}`;
    };

    // 智慧型自然數字排序器
    const naturalCollator = new Intl.Collator("zh-Hant", { numeric: true, sensitivity: "base" });
    const sortByNumberAsc = (aStr = "", bStr = "") => {
      const sA = String(aStr).trim();
      const sB = String(bStr).trim();
      const numA = sA.match(/\d+/);
      const numB = sB.match(/\d+/);
      if (numA && numB && Number(numA[0]) !== Number(numB[0])) {
        return Number(numA[0]) - Number(numB[0]);
      }
      return naturalCollator.compare(sA, sB);
    };

    // 預設測試名單（5欄：性別, 編號, 求道名, 單位, 區域）
    const generateDefaultRoster = () => {
      const unitRegions = {
        "正和單位": ["030區", "015區", "001區", "002區"],
        "崇正單位": ["025區", "005區", "012區", "003區"],
        "明善單位": ["040區", "008區", "020區", "010區"],
        "慈光單位": ["050區", "018區", "006區", "033區"]
      };
      const units = Object.keys(unitRegions);
      const genders = ["乾", "坤"];
      const roster = [];

      for (let i = 1; i <= 1000; i++) {
        const unit = units[i % units.length];
        const regions = unitRegions[unit];
        const region = regions[i % regions.length];
        const gender = genders[i % 2];
        const code = String(i).padStart(4, "0");
        const name = `道親_${i}`;
        roster.push({
          memberId: makeRecordKey(gender, code, name, i),
          gender,
          code,
          name,
          unit,
          region
        });
      }
      return roster;
    };

    const isMaleGender = (g) => ["乾", "乾道", "男", "M", "male", "童"].includes(String(g).trim());
    const isFemaleGender = (g) => ["坤", "坤道", "女", "F", "female"].includes(String(g).trim());

    function App() {
      const urlParams = new URLSearchParams(window.location.search);
      const isCheckinOnly = urlParams.get("mode") === "checkin";

      const [view, setView] = useState(isCheckinOnly ? "checkin" : "dashboard");

      const [isAdminUnlocked, setIsAdminUnlocked] = useState(() => {
        return sessionStorage.getItem("ADMIN_UNLOCKED") === "true";
      });
      const [pinModalOpen, setPinModalOpen] = useState(false);
      const [pinInput, setPinInput] = useState("");
      const pendingActionRef = useRef(null);

      const [editTargetMember, setEditTargetMember] = useState(null);
      const [editLeaveType, setEditLeaveType] = useState("事假");
      const [editLeaveNote, setEditLeaveNote] = useState("");

      const [leaveModal, setLeaveModal] = useState(null);
      const [leaveTypeInput, setLeaveTypeInput] = useState("事假");
      const [leaveCustomNote, setLeaveCustomNote] = useState("");

      const [roster, setRoster] = useState(() => {
        const saved = localStorage.getItem(`ROSTER_5COL_${CONFIG.EVENT_ID}`);
        return saved ? JSON.parse(saved) : generateDefaultRoster();
      });
      const [rosterSyncStatus, setRosterSyncStatus] = useState("連線 ikt-1000 中...");

      const [checkins, setCheckins] = useState(() => {
        const saved = localStorage.getItem(`CHECKINS_5COL_${CONFIG.EVENT_ID}`);
        return saved ? JSON.parse(saved) : {};
      });

      const [checkinTab, setCheckinTab] = useState("zone");
      const [checkinUnit, setCheckinUnit] = useState("");
      const [checkinRegion, setCheckinRegion] = useState("");
      const [checkinSearchFilter, setCheckinSearchFilter] = useState("");

      const [draftBatch, setDraftBatch] = useState({});
      const [batchConfirmModalOpen, setBatchConfirmModalOpen] = useState(false);
      const [isSubmittingBatch, setIsSubmittingBatch] = useState(false);
      const [singleConfirmPresentId, setSingleConfirmPresentId] = useState(null);
      const [queryInput, setQueryInput] = useState("");

      const [selectedUnit, setSelectedUnit] = useState("ALL");
      const [selectedRegion, setSelectedRegion] = useState("ALL");
      const [genderFilter, setGenderFilter] = useState("ALL");
      const [statusFilter, setStatusFilter] = useState("ALL");
      const [searchKeyword, setSearchKeyword] = useState("");
      const [isUploadingRoster, setIsUploadingRoster] = useState(false);
      const [isSyncingSheet, setIsSyncingSheet] = useState(false);

      const fileInputRef = useRef(null);

      useEffect(() => {
        if (!singleConfirmPresentId) return;
        const timer = setTimeout(() => setSingleConfirmPresentId(null), 3500);
        return () => clearTimeout(timer);
      }, [singleConfirmPresentId]);

      useEffect(() => {
        setDraftBatch({});
        setSingleConfirmPresentId(null);
      }, [checkinUnit, checkinRegion]);

      const requireAdmin = (actionCallback) => {
        if (isAdminUnlocked) {
          actionCallback();
        } else {
          pendingActionRef.current = actionCallback;
          setPinInput("");
          setPinModalOpen(true);
        }
      };

      const handleVerifyPin = (e) => {
        e.preventDefault();
        if (pinInput.trim() === CONFIG.ADMIN_PIN) {
          setIsAdminUnlocked(true);
          sessionStorage.setItem("ADMIN_UNLOCKED", "true");
          setPinModalOpen(false);
          if (pendingActionRef.current) {
            const act = pendingActionRef.current;
            pendingActionRef.current = null;
            act();
          }
        } else {
          alert("❌ 管理員密碼錯誤！");
          setPinInput("");
        }
      };

      const handleLockAdmin = () => {
        setIsAdminUnlocked(false);
        sessionStorage.removeItem("ADMIN_UNLOCKED");
      };

      // 連線 ikt-1000 Firebase 拉取雲端名單與即時監聽
      useEffect(() => {
        if (!CONFIG.FIREBASE_DB_URL) return;

        const rosterUrl = `${CONFIG.FIREBASE_DB_URL}/rosters/${CONFIG.EVENT_ID}.json`;
        fetch(rosterUrl)
          .then(r => r.json())
          .then(cloudRoster => {
            if (Array.isArray(cloudRoster) && cloudRoster.length > 0) {
              // 確保每筆資料都有組合唯一鍵 memberId (性別_編號)
              const normalized = cloudRoster.map((p, idx) => ({
                ...p,
                memberId: p.memberId || makeRecordKey(p.gender, p.code, p.name, idx + 1)
              }));
              setRoster(normalized);
              localStorage.setItem(`ROSTER_5COL_${CONFIG.EVENT_ID}`, JSON.stringify(normalized));
              setRosterSyncStatus(`已同步雲端名單 (${normalized.length}人)`);
            } else {
              setRosterSyncStatus("雲端尚無名單 (請從試算表推送或匯入CSV)");
            }
          })
          .catch(() => setRosterSyncStatus("使用本地快取名單"));

        const checkinsUrl = `${CONFIG.FIREBASE_DB_URL}/checkins/${CONFIG.EVENT_ID}.json`;
        const es = new EventSource(checkinsUrl);

        fetch(checkinsUrl)
          .then(r => r.json())
          .then(data => { setCheckins(data || {}); })
          .catch(err => console.error("簽到初始載入失敗:", err));

        es.addEventListener("put", (e) => {
          const payload = JSON.parse(e.data);
          if (payload.path === "/") {
            setCheckins(payload.data || {});
          } else {
            const recordKey = decodeURIComponent(payload.path.replace("/", ""));
            if (payload.data === null) {
              setCheckins(prev => {
                const next = { ...prev };
                delete next[recordKey];
                return next;
              });
            } else {
              setCheckins(prev => ({ ...prev, [recordKey]: payload.data }));
            }
          }
        });

        es.addEventListener("patch", (e) => {
          const payload = JSON.parse(e.data);
          if (payload.path === "/" && payload.data) {
            setCheckins(prev => ({ ...prev, ...payload.data }));
          }
        });

        return () => es.close();
      }, []);

      useEffect(() => {
        localStorage.setItem(`CHECKINS_5COL_${CONFIG.EVENT_ID}`, JSON.stringify(checkins));
      }, [checkins]);

      const submitSingleRecord = async (recordKey, payloadObj) => {
        const record = { ...payloadObj, time: Date.now() };
        setCheckins(prev => ({ ...prev, [recordKey]: record }));
        setSingleConfirmPresentId(null);

        setDraftBatch(prev => {
          if (!prev[recordKey]) return prev;
          const next = { ...prev };
          delete next[recordKey];
          return next;
        });

        if (!CONFIG.FIREBASE_DB_URL) return record;

        const endpoint = `${CONFIG.FIREBASE_DB_URL}/checkins/${CONFIG.EVENT_ID}/${encodeURIComponent(recordKey)}.json`;
        let delay = 600;
        for (let attempt = 1; attempt <= 4; attempt++) {
          try {
            const res = await fetch(endpoint, {
              method: "PUT",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(record)
            });
            if (res.ok) return record;
          } catch (err) {
            console.warn(`重試第 ${attempt} 次...`);
          }
          await new Promise(r => setTimeout(r, delay + Math.random() * 300));
          delay *= 2;
        }
      };

      const submitBatchCheckins = async () => {
        const entries = Object.entries(draftBatch);
        if (entries.length === 0) return;

        setIsSubmittingBatch(true);
        const now = Date.now();
        const patchPayload = {};
        entries.forEach(([recordKey, item]) => {
          if (!checkins[recordKey]) {
            patchPayload[recordKey] = {
              status: item.status,
              ...(item.leaveType ? { leaveType: item.leaveType } : {}),
              ...(item.leaveNote ? { leaveNote: item.leaveNote } : {}),
              time: now,
              method: "batch"
            };
          }
        });

        setCheckins(prev => ({ ...prev, ...patchPayload }));

        if (CONFIG.FIREBASE_DB_URL && Object.keys(patchPayload).length > 0) {
          const endpoint = `${CONFIG.FIREBASE_DB_URL}/checkins/${CONFIG.EVENT_ID}.json`;
          try {
            await fetch(endpoint, {
              method: "PATCH",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(patchPayload)
            });
          } catch (err) {
            await Promise.all(
              Object.entries(patchPayload).map(([rKey, rec]) =>
                fetch(`${CONFIG.FIREBASE_DB_URL}/checkins/${CONFIG.EVENT_ID}/${encodeURIComponent(rKey)}.json`, {
                  method: "PUT",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify(rec)
                })
              )
            );
          }
        }

        setIsSubmittingBatch(false);
        setBatchConfirmModalOpen(false);
        setDraftBatch({});
      };

      const resetMemberToAbsent = async (recordKey) => {
        setCheckins(prev => {
          const next = { ...prev };
          delete next[recordKey];
          return next;
        });
        if (!CONFIG.FIREBASE_DB_URL) return;

        const endpoint = `${CONFIG.FIREBASE_DB_URL}/checkins/${CONFIG.EVENT_ID}/${encodeURIComponent(recordKey)}.json`;
        await fetch(endpoint, { method: "DELETE" });
      };

      const openLeaveReasonModal = (person, mode = "single") => {
        setSingleConfirmPresentId(null);
        if (mode === "draft" && draftBatch[person.memberId]?.status === "leave") {
          setDraftBatch(prev => {
            const next = { ...prev };
            delete next[person.memberId];
            return next;
          });
          return;
        }
        setLeaveTypeInput("事假");
        setLeaveCustomNote("");
        setLeaveModal({ person, mode });
      };

      const handleConfirmLeaveModal = async (e) => {
        e.preventDefault();
        if (!leaveModal) return;
        const { person, mode } = leaveModal;
        const cleanNote = leaveCustomNote.trim();

        if (leaveTypeInput === "自行填寫" && !cleanNote) {
          alert("請輸入請假原因或預計到達時間！");
          return;
        }

        if (mode === "draft") {
          setDraftBatch(prev => ({
            ...prev,
            [person.memberId]: {
              status: "leave",
              leaveType: leaveTypeInput,
              leaveNote: cleanNote
            }
          }));
        } else {
          await submitSingleRecord(person.memberId, {
            status: "leave",
            leaveType: leaveTypeInput,
            leaveNote: cleanNote,
            method: "self"
          });
        }
        setLeaveModal(null);
      };

      const handleOpenEditLockedMember = (member) => {
        requireAdmin(() => {
          const cur = checkins[member.memberId];
          setEditLeaveType(cur?.leaveType || "事假");
          setEditLeaveNote(cur?.leaveNote || "");
          setEditTargetMember(member);
        });
      };

      const toggleDraftPresent = (recordKey) => {
        setSingleConfirmPresentId(null);
        setDraftBatch(prev => {
          const next = { ...prev };
          if (next[recordKey]?.status === "present") {
            delete next[recordKey];
          } else {
            next[recordKey] = { status: "present" };
          }
          return next;
        });
      };

      const selectAllAbsentInZone = (zoneMembers) => {
        const next = { ...draftBatch };
        zoneMembers.forEach(m => {
          if (!checkins[m.memberId]) {
            next[m.memberId] = { status: "present" };
          }
        });
        setDraftBatch(next);
      };

      // ==========================================
      // 匯入 5 欄 CSV (性別, 編號, 求道名, 單位, 區域) - 自動偵測是否含舊版 memberId 欄
      // ==========================================
      const handleImportCSV = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = async (evt) => {
          const lines = evt.target.result.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
          if (lines.length < 2) {
            alert("CSV 檔案內容過少或格式不正確！");
            return;
          }

          const firstCols = lines[0].split(",").map(c => c.trim());
          const hasHeader = /性別|編號|求道名|單位|區域|memberId/i.test(lines[0]);
          // 智慧判斷：如果第 1 欄是 memberId (6欄格式) 則從第 2 欄開始讀；否則直接從第 1 欄讀 5 欄格式
          const offset = /memberId/i.test(firstCols[0]) ? 1 : 0;
          const startIdx = hasHeader ? 1 : 0;

          const imported = lines.slice(startIdx).map((line, idx) => {
            const cols = line.split(",").map(c => c.trim());
            const gender = cols[0 + offset] || "乾";
            const code = cols[1 + offset] || String(idx + 1).padStart(3, "0");
            const name = cols[2 + offset] || `未命名_${idx + 1}`;
            const unit = cols[3 + offset] || "未分單位";
            const region = cols[4 + offset] || "未分區域";
            return {
              memberId: makeRecordKey(gender, code, name, idx + 1),
              gender,
              code,
              name,
              unit,
              region
            };
          });

          setRoster(imported);
          localStorage.setItem(`ROSTER_5COL_${CONFIG.EVENT_ID}`, JSON.stringify(imported));
          setSelectedUnit("ALL");
          setSelectedRegion("ALL");

          if (CONFIG.FIREBASE_DB_URL) {
            setIsUploadingRoster(true);
            setRosterSyncStatus("正在上傳 5 欄名單至 ikt-1000...");
            try {
              const res = await fetch(`${CONFIG.FIREBASE_DB_URL}/rosters/${CONFIG.EVENT_ID}.json`, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(imported)
              });
              if (res.ok) {
                setRosterSyncStatus(`已同步雲端名單 (${imported.length}人)`);
                alert(`✅ 成功匯入 ${imported.length} 筆 5 欄名單（保留原性別/編號排序）至 ikt-1000 雲端！`);
              } else {
                throw new Error("HTTP " + res.status);
              }
            } catch (err) {
              setRosterSyncStatus("雲端上傳失敗");
              alert("⚠️ 上傳至 ikt-1000 失敗，請檢查 Firebase Rules 權限！");
            } finally {
              setIsUploadingRoster(false);
            }
          }
        };
        reader.readAsText(file, "UTF-8");
        e.target.value = "";
      };

      const handleClearAllCheckins = () => {
        requireAdmin(async () => {
          if (!confirm("⚠️ 確定要【清空全場所有已簽到與請假紀錄】嗎？此動作無法復原！")) return;
          setCheckins({});
          setDraftBatch({});
          localStorage.removeItem(`CHECKINS_5COL_${CONFIG.EVENT_ID}`);

          if (CONFIG.FIREBASE_DB_URL) {
            await fetch(`${CONFIG.FIREBASE_DB_URL}/checkins/${CONFIG.EVENT_ID}.json`, { method: "DELETE" });
            alert("✅ 已成功清空雲端與本機的所有紀錄！");
          }
        });
      };

      const handleTriggerSheetSync = async () => {
        if (!CONFIG.GAS_SYNC_URL) {
          alert("💡 請在 Google 試算表上方點選「⚡ 千人點名同步系統 -> 📥 1. 立即從 Firebase 同步最新簽到與請假狀況」或開啟「每 1 分鐘背景自動同步」！");
          return;
        }
        setIsSyncingSheet(true);
        try {
          await fetch(CONFIG.GAS_SYNC_URL, { method: "POST", mode: "no-cors", body: JSON.stringify({ action: "sync" }) });
          alert("✅ 已發送同步指令至 Google 試算表！");
        } catch (err) {
          alert("⚠️ 觸發失敗，請直接在試算表內點選同步選單。");
        } finally {
          setIsSyncingSheet(false);
        }
      };

      // 統計聚合
      const stats = useMemo(() => {
        const unitMap = {};
        const regionMap = {};
        let totalPresent = 0, totalLeave = 0, totalLate = 0;
        let maleTotal = 0, malePresent = 0;
        let femaleTotal = 0, femalePresent = 0;

        roster.forEach(p => {
          const c = checkins[p.memberId];
          const isPresent = c?.status === "present";
          const isLeave = c?.status === "leave";
          const isLate = isLeave && c?.leaveType === "晚到";
          const isM = isMaleGender(p.gender);
          const isF = isFemaleGender(p.gender);

          if (isPresent) totalPresent++;
          if (isLeave) totalLeave++;
          if (isLate) totalLate++;
          if (isM) { maleTotal++; if (isPresent) malePresent++; }
          if (isF) { femaleTotal++; if (isPresent) femalePresent++; }

          if (!unitMap[p.unit]) {
            unitMap[p.unit] = {
              name: p.unit,
              total: 0, present: 0, leave: 0, late: 0,
              maleTotal: 0, malePresent: 0,
              femaleTotal: 0, femalePresent: 0
            };
          }
          const u = unitMap[p.unit];
          u.total++;
          if (isPresent) u.present++;
          if (isLeave) u.leave++;
          if (isLate) u.late++;
          if (isM) { u.maleTotal++; if (isPresent) u.malePresent++; }
          if (isF) { u.femaleTotal++; if (isPresent) u.femalePresent++; }

          if (selectedUnit === "ALL" || p.unit === selectedUnit) {
            const regionKey = `${p.unit}_${p.region}`;
            if (!regionMap[regionKey]) {
              regionMap[regionKey] = {
                key: regionKey,
                name: p.region,
                unit: p.unit,
                total: 0, present: 0, leave: 0, late: 0,
                maleTotal: 0, malePresent: 0,
                femaleTotal: 0, femalePresent: 0
              };
            }
            const r = regionMap[regionKey];
            r.total++;
            if (isPresent) r.present++;
            if (isLeave) r.leave++;
            if (isLate) r.late++;
            if (isM) { r.maleTotal++; if (isPresent) r.malePresent++; }
            if (isF) { r.femaleTotal++; if (isPresent) r.femalePresent++; }
          }
        });

        const sortedUnits = Object.values(unitMap).sort((a, b) => sortByNumberAsc(a.name, b.name));
        const sortedRegions = Object.values(regionMap).sort((a, b) => {
          const uCompare = sortByNumberAsc(a.unit, b.unit);
          if (uCompare !== 0) return uCompare;
          return sortByNumberAsc(a.name, b.name);
        });

        return {
          total: roster.length,
          present: totalPresent,
          leave: totalLeave,
          late: totalLate,
          absent: roster.length - totalPresent - totalLeave,
          rate: roster.length ? ((totalPresent / roster.length) * 100).toFixed(1) : "0.0",
          maleTotal, malePresent,
          femaleTotal, femalePresent,
          units: sortedUnits,
          regions: sortedRegions
        };
      }, [roster, checkins, selectedUnit]);

      const checkinRegionsForUnit = useMemo(() => {
        if (!checkinUnit) return [];
        const map = {};
        roster.forEach(p => {
          if (p.unit === checkinUnit) {
            if (!map[p.region]) map[p.region] = { name: p.region, total: 0, present: 0, leave: 0 };
            map[p.region].total++;
            const st = checkins[p.memberId]?.status;
            if (st === "present") map[p.region].present++;
            if (st === "leave") map[p.region].leave++;
          }
        });
        return Object.values(map).sort((a, b) => sortByNumberAsc(a.name, b.name));
      }, [roster, checkins, checkinUnit]);

      const checkinZoneMembers = useMemo(() => {
        if (!checkinUnit || !checkinRegion) return [];
        return roster.filter(p => {
          if (p.unit !== checkinUnit || p.region !== checkinRegion) return false;
          if (checkinSearchFilter.trim()) {
            const q = checkinSearchFilter.trim().toLowerCase();
            return (
              p.name.toLowerCase().includes(q) ||
              p.code.toLowerCase().includes(q)
            );
          }
          return true;
        });
      }, [roster, checkinUnit, checkinRegion, checkinSearchFilter]);

      const searchMatches = useMemo(() => {
        const q = queryInput.trim().toLowerCase();
        if (!q) return [];
        return roster
          .filter(m =>
            m.code.toLowerCase().includes(q) ||
            m.name.toLowerCase().includes(q)
          )
          .slice(0, 15);
      }, [roster, queryInput]);

      const filteredList = useMemo(() => {
        return roster.filter(p => {
          if (selectedUnit !== "ALL" && p.unit !== selectedUnit) return false;
          if (selectedRegion !== "ALL" && p.region !== selectedRegion) return false;
          if (genderFilter === "MALE" && !isMaleGender(p.gender)) return false;
          if (genderFilter === "FEMALE" && !isFemaleGender(p.gender)) return false;

          const c = checkins[p.memberId];
          const st = c?.status || "absent";
          if (statusFilter === "PRESENT" && st !== "present") return false;
          if (statusFilter === "ABSENT" && st !== "absent") return false;
          if (statusFilter === "LEAVE" && st !== "leave") return false;
          if (statusFilter === "LATE" && !(st === "leave" && c?.leaveType === "晚到")) return false;

          if (searchKeyword) {
            const q = searchKeyword.trim().toLowerCase();
            return (
              p.code.toLowerCase().includes(q) ||
              p.name.toLowerCase().includes(q) ||
              p.unit.toLowerCase().includes(q) ||
              p.region.toLowerCase().includes(q) ||
              (c?.leaveType || "").toLowerCase().includes(q) ||
              (c?.leaveNote || "").toLowerCase().includes(q)
            );
          }
          return true;
        });
      }, [roster, checkins, selectedUnit, selectedRegion, genderFilter, statusFilter, searchKeyword]);

      const exportCSV = (isTemplate = false) => {
        if (isTemplate) {
          // 5 欄範本：性別,編號,求道名,單位,區域
          const sample = "\uFEFF性別,編號,求道名,單位,區域\n乾,001,王大明,正和單位,015區\n坤,001,林淑芬,正和單位,030區\n乾,002,陳建宏,正和單位,001區";
          const blob = new Blob([sample], { type: "text/csv;charset=utf-8;" });
          const a = document.createElement("a");
          a.href = URL.createObjectURL(blob);
          a.download = "點名匯入範本_5欄免ID.csv";
          a.click();
          return;
        }

        const headers = ["性別", "編號", "求道名", "單位", "區域", "出席狀態", "請假備註", "登記時間", "登記方式"];
        const rows = roster.map(p => {
          const c = checkins[p.memberId];
          let stText = "未到";
          if (c?.status === "present") stText = "已出席";
          else if (c?.status === "leave") {
            stText = c.leaveType === "晚到" ? "晚到" : `請假(${c.leaveType || "事假"})`;
          }
          const noteText = c?.leaveNote || "-";
          const tText = c?.time ? new Date(c.time).toLocaleTimeString("zh-TW", { hour12: false }) : "-";
          const mText = c?.method === "admin" ? "管理員修改" : c?.method === "batch" ? "區域批次" : c?.method === "self" ? "單筆點名" : "-";
          return [p.gender, p.code, p.name, p.unit, p.region, stText, noteText, tText, mText].join(",");
        });
        const csv = "\uFEFF" + [headers.join(","), ...rows].join("\n");
        const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = `單位區域出席總表_${new Date().toISOString().slice(0, 10)}.csv`;
        a.click();
      };

      const renderMemberActionButtons = (person, allowBatchDraft = false) => {
        const existingRecord = checkins[person.memberId];
        const draftItem = draftBatch[person.memberId];
        const isPromptingPresent = singleConfirmPresentId === person.memberId;

        if (existingRecord) {
          return (
            <button
              type="button"
              onClick={() => handleOpenEditLockedMember(person)}
              className="px-2.5 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-600 text-xs font-medium inline-flex items-center gap-1 transition"
            >
              <span>🔒 修改狀態</span>
            </button>
          );
        }

        return (
          <div className="flex items-center justify-end gap-1.5 flex-wrap">
            {allowBatchDraft && (
              <>
                <button
                  type="button"
                  onClick={() => toggleDraftPresent(person.memberId)}
                  className={`px-2.5 py-1.5 rounded-lg text-xs font-bold border transition ${
                    draftItem?.status === "present"
                      ? "bg-emerald-500 text-slate-950 border-emerald-300 ring-2 ring-emerald-400/50"
                      : "bg-slate-900 hover:bg-slate-800 text-emerald-300 border-emerald-700/70"
                  }`}
                >
                  {draftItem?.status === "present" ? "☑ 預選簽到" : "☐ 預選簽到"}
                </button>
                <button
                  type="button"
                  onClick={() => openLeaveReasonModal(person, "draft")}
                  className={`px-2.5 py-1.5 rounded-lg text-xs font-bold border transition ${
                    draftItem?.status === "leave"
                      ? "bg-amber-400 text-slate-950 border-amber-200 ring-2 ring-amber-400/50"
                      : "bg-slate-900 hover:bg-slate-800 text-amber-300 border-amber-700/70"
                  }`}
                >
                  {draftItem?.status === "leave"
                    ? `☑ 預選${draftItem.leaveType}${draftItem.leaveNote ? `(${draftItem.leaveNote})` : ""}`
                    : "☐ 預選請假"}
                </button>
              </>
            )}

            {isPromptingPresent ? (
              <button
                type="button"
                onClick={() => submitSingleRecord(person.memberId, { status: "present", method: "self" })}
                className="px-3 py-1.5 rounded-lg bg-yellow-400 hover:bg-yellow-300 text-slate-950 font-extrabold text-xs shadow-lg animate-pulse"
              >
                👉 確定送出簽到？
              </button>
            ) : (
              <button
                type="button"
                onClick={() => setSingleConfirmPresentId(person.memberId)}
                className="px-2.5 py-1.5 rounded-lg bg-emerald-700 hover:bg-emerald-600 text-white text-xs font-semibold transition"
              >
                {allowBatchDraft ? "單筆速簽" : "簽到"}
              </button>
            )}

            <button
              type="button"
              onClick={() => openLeaveReasonModal(person, "single")}
              className="px-2.5 py-1.5 rounded-lg bg-amber-700 hover:bg-amber-600 text-white text-xs font-semibold transition"
            >
              請假
            </button>
          </div>
        );
      };

      const renderStatusBadge = (c) => {
        if (!c) {
          return (
            <span className="inline-flex items-center gap-1 text-xs px-2 py-0.5 rounded-full bg-rose-500/20 text-rose-300 border border-rose-500/30">
              ✕ 未到
            </span>
          );
        }
        if (c.status === "present") {
          return (
            <span className="inline-flex items-center gap-1 text-xs px-2 py-0.5 rounded-full bg-emerald-500/20 text-emerald-300 border border-emerald-500/30">
              ● 已到 {new Date(c.time).toLocaleTimeString("zh-TW", { hour12: false })}
            </span>
          );
        }
        if (c.status === "leave") {
          const isLate = c.leaveType === "晚到";
          const label = isLate
            ? `🕒 晚到${c.leaveNote ? `：${c.leaveNote}` : ""}`
            : `▲ 請假(${c.leaveType || "事假"})${c.leaveNote ? `：${c.leaveNote}` : ""}`;
          return (
            <span
              className={`inline-flex items-center gap-1 text-xs px-2 py-0.5 rounded-full border ${
                isLate
                  ? "bg-purple-500/20 text-purple-300 border-purple-500/40 font-semibold"
                  : "bg-amber-500/20 text-amber-300 border-amber-500/30"
              }`}
            >
              {label}
            </span>
          );
        }
        return null;
      };

      const draftEntries = Object.entries(draftBatch);
      const draftPresentCount = draftEntries.filter(([, item]) => item.status === "present").length;
      const draftLeaveCount = draftEntries.filter(([, item]) => item.status === "leave").length;

      return (
        <div className="min-h-screen flex flex-col">

                </div>

                  <span className="font-bold text-white text-base">{leaveModal.person.name}</span>
                  <span className="ml-2 font-mono text-xs text-amber-300">({leaveModal.person.gender} / {leaveModal.person.code})</span>

                <div className="flex gap-2 pt-1">
                  <button type="button" onClick={() => setLeaveModal(null)} className="flex-1 py-2.5 rounded-xl bg-slate-700 hover:bg-slate-600 text-xs text-slate-300">取消</button>
                  <button type="submit" className="flex-1 py-2.5 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-extrabold text-xs shadow-lg transition">
                    {leaveModal.mode === "draft" ? "加入本批預選" : "👉 確定送出登記"}
                  </button>
                </div>
              </form>
            </div>
          )}

          {/* 彈窗 2：管理員密碼驗證視窗 */}
          {pinModalOpen && (
            <div className="fixed inset-0 z-50 bg-black/75 flex items-center justify-center p-4">

                <div className="flex items-center justify-between">
                  <h3 className="text-base font-bold text-white flex items-center gap-2">🔒 請輸入管理員密碼</h3>
                  <button type="button" onClick={() => setPinModalOpen(false)} className="text-slate-400 hover:text-white text-sm">✕</button>
                </div>
                <p className="text-xs text-slate-300 leading-relaxed">
                  為防止誤觸，<b>修改已有簽到/請假紀錄的人員</b>、匯入名單或清空紀錄需驗證管理員密碼（預設 8888）。
                </p>
                <input
                  type="password"
                  autoFocus
                  required
                  value={pinInput}
                  onChange={e => setPinInput(e.target.value)}
                  placeholder="請輸入密碼..."
                  className="w-full px-4 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-white text-center text-lg tracking-widest focus:outline-none focus:border-indigo-500"
                />
                <div className="flex gap-2">
                  <button type="button" onClick={() => setPinModalOpen(false)} className="flex-1 py-2.5 rounded-xl bg-slate-700 hover:bg-slate-600 text-xs text-slate-300">取消</button>
                  <button type="submit" className="flex-1 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-xs font-bold text-white">驗證並繼續</button>
                </div>
              </form>
            </div>
          )}

          {/* 彈窗 3：修改已簽到/請假人員狀態 */}
          {editTargetMember && (
            <div className="fixed inset-0 z-50 bg-black/75 flex items-center justify-center p-4">
              <div className="bg-slate-800 border border-slate-700 rounded-2xl p-6 max-w-md w-full shadow-2xl space-y-4">
                <div className="flex items-center justify-between">
                  <h3 className="text-base font-bold text-white">✏️ 修改出席 / 請假狀態</h3>
                  <button onClick={() => setEditTargetMember(null)} className="text-slate-400 hover:text-white text-sm">✕</button>
                </div>

                <div className="bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm space-y-1">
                  <div className="font-bold text-white text-base">
                    {editTargetMember.name} <span className="text-amber-300 font-mono text-xs">({editTargetMember.gender} / {editTargetMember.code})</span>
                  </div>
                  <div className="text-xs text-slate-400">{editTargetMember.unit} ／ {editTargetMember.region}</div>
                  <div className="pt-1">{renderStatusBadge(checkins[editTargetMember.memberId])}</div>
                </div>

                <button
                  onClick={async () => {
                    await submitSingleRecord(editTargetMember.memberId, { status: "present", method: "admin" });
                    setEditTargetMember(null);
                  }}
                  className="w-full py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-sm transition"
                >
                  ● 改為【已出席】（人已到場）
                </button>

                <div className="bg-slate-900/80 border border-slate-700 rounded-xl p-3 space-y-2.5">
                  <div className="text-xs font-bold text-amber-300">或更改為請假 / 晚到：</div>
                  <div className="grid grid-cols-3 gap-1.5">
                    {LEAVE_REASONS.map(r => (
                      <button
                        key={r}
                        type="button"
                        onClick={() => setEditLeaveType(r)}
                        className={`py-1.5 rounded-lg text-xs font-bold border ${
                          editLeaveType === r ? "bg-amber-500 text-slate-950 border-amber-200" : "bg-slate-800 text-slate-300 border-slate-700"
                        }`}
                      >
                        {r}
                      </button>
                    ))}
                  </div>
                  <input
                    type="text"
                    value={editLeaveNote}
                    onChange={e => setEditLeaveNote(e.target.value)}
                    placeholder="原因或預計時間備註（自行填寫時必填）..."
                    className="w-full px-3 py-2 rounded-lg bg-slate-800 border border-slate-700 text-xs text-white"
                  />
                  <button
                    onClick={async () => {
                      if (editLeaveType === "自行填寫" && !editLeaveNote.trim()) {
                        alert("請輸入請假原因！");
                        return;
                      }
                      await submitSingleRecord(editTargetMember.memberId, {
                        status: "leave",
                        leaveType: editLeaveType,
                        leaveNote: editLeaveNote.trim(),
                        method: "admin"
                      });
                      setEditTargetMember(null);
                    }}
                    className="w-full py-2 rounded-lg bg-amber-600 hover:bg-amber-500 text-white font-bold text-xs transition"
                  >
                    ▲ 儲存為【{editLeaveType}】
                  </button>
                </div>

                <button
                  onClick={async () => {
                    await resetMemberToAbsent(editTargetMember.memberId);
                    setEditTargetMember(null);
                  }}
                  className="w-full py-2 rounded-xl bg-rose-800/80 hover:bg-rose-700 text-rose-100 font-semibold text-xs transition"
                >
                  ✕ 清除紀錄，改回【未到】
                </button>
              </div>
            </div>
          )}

          {/* 彈窗 4：整批預選送出前二次確認清單 */}
          {batchConfirmModalOpen && (
            <div className="fixed inset-0 z-50 bg-black/75 flex items-center justify-center p-4">
              <div className="bg-slate-800 border border-slate-700 rounded-2xl p-6 max-w-md w-full shadow-2xl space-y-4">
                <div className="flex items-center justify-between">
                  <h3 className="text-lg font-bold text-white">✅ 確認送出本批點名（共 {draftEntries.length} 人）</h3>
                  <button onClick={() => setBatchConfirmModalOpen(false)} className="text-slate-400 hover:text-white text-sm">✕</button>
                </div>

                <div className="flex gap-3 text-xs">
                  <span className="px-2.5 py-1 rounded-lg bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 font-bold">
                    簽到：{draftPresentCount} 人
                  </span>
                  <span className="px-2.5 py-1 rounded-lg bg-amber-500/20 text-amber-300 border border-amber-500/30 font-bold">
                    請假/晚到：{draftLeaveCount} 人
                  </span>
                </div>

                <div className="max-h-60 overflow-y-auto bg-slate-900 border border-slate-700 rounded-xl p-3 divide-y divide-slate-800 text-sm">
                  {draftEntries.map(([rKey, item]) => {
                    const m = roster.find(x => x.memberId === rKey);
                    if (!m) return null;
                    return (
                      <div key={rKey} className="py-2 flex items-center justify-between gap-2">
                        <div>
                          <span className="font-bold text-white">{m.name}</span>
                          <span className="ml-2 text-xs text-slate-400 font-mono">({m.gender}/{m.code}・{m.region})</span>
                        </div>
                        <span className={`text-xs font-bold px-2 py-0.5 rounded ${
                          item.status === "present"
                            ? "bg-emerald-500/20 text-emerald-300"
                            : item.leaveType === "晚到"
                            ? "bg-purple-500/20 text-purple-300"
                            : "bg-amber-500/20 text-amber-300"
                        }`}>
                          {item.status === "present"
                            ? "● 簽到"
                            : `${item.leaveType}${item.leaveNote ? `(${item.leaveNote})` : ""}`}
                        </span>
                      </div>
                    );
                  })}
                </div>

                <p className="text-xs text-amber-300/90">

                <div className="flex gap-2">
                  <button type="button" onClick={() => setBatchConfirmModalOpen(false)} className="flex-1 py-3 rounded-xl bg-slate-700 hover:bg-slate-600 text-xs font-semibold text-slate-200">返回修改</button>
                  <button type="button" disabled={isSubmittingBatch} onClick={submitBatchCheckins} className="flex-1 py-3 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-sm font-extrabold text-white shadow-lg shadow-emerald-600/30 disabled:opacity-50">

                  </button>

          {/* 頂部導覽列 */}

                          );
                        })}
                      </div>
                    </div>
                  )}
                </div>
              )}

              {checkinTab === "search" && (
                <div className="bg-slate-800/90 border border-slate-700 rounded-2xl p-5 space-y-4">
                  <div>
                    <h3 className="text-base font-bold text-white">🔍 搜尋個人編號或求道名</h3>
                    <p className="text-xs text-slate-400 mt-0.5">輸入求道名或編號，點選「簽到」或「請假」即可完成登記。</p>
                  </div>

                  <input
                    type="text"
                    value={queryInput}
                    onChange={e => setQueryInput(e.target.value)}
                    placeholder="請輸入編號或求道名..."
                    className="w-full px-4 py-3 rounded-xl bg-slate-900 border border-slate-700 text-white text-base focus:outline-none focus:border-indigo-500"
                  />

                  {searchMatches.length > 0 && (
                    <div className="divide-y divide-slate-700/70 bg-slate-900/70 rounded-xl border border-slate-700 p-2">
                      {searchMatches.map(person => {
                        const c = checkins[person.memberId];
                        return (
                          <div key={person.memberId} className="p-3 flex flex-wrap items-center justify-between gap-3">
                            <div>
                              <div className="font-bold text-base text-white flex items-center gap-2">
                                <span>{person.name}</span>
                                <span className="text-xs font-mono px-1.5 py-0.5 rounded bg-slate-800 text-amber-300">
                                  編號 {person.code}
                                </span>
                                <span className="text-xs text-slate-400">({person.gender})</span>
                              </div>
                              <div className="text-xs text-slate-400 mt-1 flex items-center gap-2 flex-wrap">
                                <span>
                                  <b className="text-emerald-300">{person.unit}</b> ／ <b className="text-sky-300">{person.region}</b>
                                </span>
                                {renderStatusBadge(c)}
                              </div>
                            </div>
                            <div>{renderMemberActionButtons(person, false)}</div>
                          </div>
                        );
                      })}
                    </div>
                  )}
                </div>
              )}
            </main>
          )}

          {/* 底部浮動確認列 */}
          {draftEntries.length > 0 && (
            <div className="fixed bottom-0 inset-x-0 z-40 bg-slate-950/95 border-t-2 border-emerald-500 px-4 py-3 shadow-2xl">
              <div className="max-w-4xl mx-auto flex flex-wrap items-center justify-between gap-3">
                <div className="flex items-center gap-3">
                  <span className="px-3 py-1 rounded-full bg-emerald-500/20 text-emerald-300 font-bold text-xs border border-emerald-500/40">
                    已預選 {draftEntries.length} 人
                  </span>
                  <span className="text-xs text-slate-300">
                    （簽到 <b>{draftPresentCount}</b> 人 ／ 請假或晚到 <b>{draftLeaveCount}</b> 人）
                  </span>
                </div>
                <div className="flex items-center gap-2">
                  <button type="button" onClick={() => setDraftBatch({})} className="px-3 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs text-slate-300">取消預選</button>
                  <button
                    type="button"
                    onClick={() => setBatchConfirmModalOpen(true)}
                    className="px-5 py-2.5 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-extrabold text-sm shadow-lg shadow-emerald-500/30 transition"
                  >
                    ✅ 確認送出本批點名 ({draftEntries.length}人)
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
